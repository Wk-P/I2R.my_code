; The three long-running processes of the lab container (what systemd user services do on the host).
[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:panel]
command=/app/.venv/bin/python -m uvicorn app.backend.main:app --host 0.0.0.0 --port 8081
directory=/app
autorestart=true
stdout_logfile=/app/logs/panel.log
redirect_stderr=true

[program:queue]
; serial experiment queue; experiments it starts keep running if only this program restarts
command=/app/.venv/bin/python -u src/scripts/queue_runner.py run
directory=/app
autorestart=true
stopasgroup=false
killasgroup=false
stdout_logfile=/app/logs/queue_runner.log
redirect_stderr=true

[program:monitor]
command=/app/.venv/bin/python -m app.backend.monitor
directory=/app
autorestart=true
stdout_logfile=/app/logs/monitor.log
redirect_stderr=true
